name: tests

on:
  push:
    paths-ignore:
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '.gitignore'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Catch2 host test suite
        run: make ci-test
        working-directory: tests
